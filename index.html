<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nectar · Admin prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --text:#000;--annotation:#666;--primary:#4368f5;--fine:#e6e6e6;--bg:#f5f5f5;--surface:#fff;
  --success:#00992e;--warning:#ffcb00;--error:#d21e00;--disabled:#ccc;--blue50:#f5f7ff;--blue100:#d9e1fd;
  --yellow400:#ffd533;--warnbg:#fff5cc;--errbg:#ffd9d3;--snack:#212121;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Noto Sans',system-ui,sans-serif;font-size:14px;line-height:1.45;color:var(--text);background:var(--bg);min-width:1100px}
h1,h2,h3,h4,p{margin:0}
.h3{font-size:22px;font-weight:600;line-height:1.4}
.h4{font-size:18px;font-weight:600;line-height:1.4}
.h5{font-size:16px;font-weight:600}
.b1{font-size:16px}
.ann{color:var(--annotation)}
.cap{font-size:12px;color:var(--annotation)}
.icon{width:24px;height:24px;fill:currentColor;flex:none;display:block}
.icon.sm{width:20px;height:20px}

/* app bars */
.appbar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20}
.appbar.black{background:#000;color:#fff}
.appbar.yellow{background:var(--yellow400);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.appbar .title{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:600}
.appbar.yellow .title{font-size:16px}
.role{font-size:14px}

/* buttons */
.btn{font:inherit;text-transform:uppercase;font-weight:600;font-size:14px;height:36px;padding:0 16px;border-radius:4px;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:focus-visible{outline:3px solid #4368f566;outline-offset:2px}
.btn.primary{background:var(--primary);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.btn.primary:hover{background:#2e55f0}
.btn.secondary{background:var(--bg);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.btn.secondary:hover{background:#ebebeb}
.btn.flat{background:transparent;color:var(--primary);padding:0 8px}
.btn.flat:hover{background:#4368f514}
.btn.flat.danger{color:var(--error)}
.btn.flat.danger:hover{background:#d21e0014}
.btn.white{background:transparent;color:#fff}
.btn.white:hover{background:#ffffff1f}
.btn[disabled]{background:var(--fine)!important;color:#999!important;box-shadow:none!important;cursor:not-allowed}
.btn.flat[disabled]{background:transparent!important}
.iconbtn{background:none;border:0;padding:4px;border-radius:50%;cursor:pointer;color:var(--annotation);display:inline-flex}
.iconbtn:hover{background:#0000000f;color:var(--text)}

/* layout */
.content{padding:32px 32px 112px}
.content.withpanel{margin-right:400px}
.page{background:var(--surface);border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.2);padding:32px}
.page.narrow{max-width:960px;margin:0 auto}
.stack>*+*{margin-top:24px}
.row{display:flex;align-items:center;gap:16px}
.spacer{flex:1}

/* bottom bar */
.bottombar{position:fixed;left:0;right:0;bottom:0;height:72px;background:#fff;box-shadow:0 -1px 4px rgba(0,0,0,.15);display:flex;align-items:center;padding:0 24px;gap:16px;z-index:30}

/* fields */
.field{position:relative;background:var(--bg);border-radius:4px 4px 0 0;border-bottom:1px solid var(--annotation);padding:20px 12px 5px;min-height:50px}
.field:focus-within{border-bottom:2px solid var(--primary);padding-bottom:4px}
.field.error{border-bottom:2px solid var(--error);padding-bottom:4px}
.field label{position:absolute;left:12px;top:5px;font-size:12px;color:var(--annotation);pointer-events:none;transition:all .15s ease}
.field input:placeholder-shown:not(:focus)+label{top:14px;font-size:16px}
.field:focus-within label{color:var(--primary)}
.field.error label{color:var(--error)}
.field input,.field select{font:inherit;font-size:15px;border:0;background:transparent;width:100%;padding:0;outline:none;color:var(--text);appearance:none}
.field select{cursor:pointer;padding-right:24px}
.field .caret{position:absolute;right:6px;bottom:8px;pointer-events:none;color:var(--annotation)}
.field select.placeholder{color:var(--annotation)}
.help{font-size:12px;color:var(--annotation);margin:4px 12px 0}
.errtext{font-size:12px;color:var(--error);margin:4px 12px 0}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}

/* alerts */
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:4px}
.alert.warning{background:var(--warnbg)} .alert.warning .icon{color:#b38f00}
.alert.error{background:var(--errbg)} .alert.error .icon{color:var(--error)}
.alert.info{background:rgba(33,150,243,.12)} .alert.info .icon{color:#2196f3}
.alert.success{background:#d9f5e1} .alert.success .icon{color:var(--success)}
.alert ul{margin:4px 0 0;padding-left:18px}

/* tables */
table{border-collapse:collapse;width:100%}
th{font-weight:400;color:var(--annotation);text-align:left;padding:10px 12px;border-bottom:1px solid var(--fine);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--fine);vertical-align:middle}
tr.sel td{background:var(--blue50)}
.sorth{background:none;border:0;font:inherit;color:var(--annotation);cursor:pointer;display:inline-flex;align-items:center;gap:2px;padding:0}
.sorth.on{color:var(--text)}
input[type=checkbox],input[type=radio]{accent-color:var(--primary);width:18px;height:18px;margin:0;cursor:pointer}
.chk{display:inline-flex;gap:8px;align-items:center;cursor:pointer}

/* option cards */
.options{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.opt{border:1px solid var(--fine);border-radius:4px;padding:20px 24px;display:flex;gap:16px;cursor:pointer;background:#fff}
.opt.on{border:2px solid var(--primary);background:var(--blue50);padding:19px 23px}
.opt ul{margin:8px 0 0;padding-left:18px;color:var(--annotation)}

/* dropzone */
.drop{border:2px dashed var(--disabled);border-radius:4px;padding:24px;display:flex;align-items:center;justify-content:center;gap:12px;flex-direction:column;text-align:center}
.filechip{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--fine)}

/* side panel */
.panel{position:fixed;right:0;top:56px;bottom:72px;width:400px;background:#fff;border-left:1px solid var(--fine);overflow-y:auto;padding:24px;z-index:10}
.grp{padding:16px 0;border-top:1px solid var(--fine)}
.grp:first-of-type{border-top:0}
.slots{display:flex;gap:4px;flex:1}
.slot{height:10px;flex:1;border-radius:2px;background:var(--fine)}
.slot.f{background:var(--primary)}
.member{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.rename input{font:inherit;font-weight:600;font-size:15px;border:0;border-bottom:2px solid var(--primary);background:var(--bg);padding:2px 6px;outline:none;width:180px}

/* selection bar + menu */
.selbar{background:#fafafa;border-radius:4px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:16px;min-height:52px}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:42px;background:#fff;border-radius:4px;box-shadow:0 4px 12px rgba(0,0,0,.25);min-width:260px;padding:6px 0;z-index:40}
.menu button{display:flex;justify-content:space-between;gap:16px;width:100%;background:none;border:0;font:inherit;padding:10px 16px;cursor:pointer;text-align:left}
.menu button:hover:not([disabled]){background:var(--bg)}
.menu button[disabled]{color:#999;cursor:not-allowed}
.filter{display:flex;align-items:center;gap:8px;border:1px solid var(--disabled);border-radius:4px;padding:0 10px;height:40px;background:#fff}
.filter input{border:0;outline:none;font:inherit;flex:1}
.filter:focus-within{border-color:var(--primary)}

/* snackbar + modal */
.snackbar{position:fixed;left:32px;bottom:96px;background:var(--snack);color:#fff;border-radius:4px;padding:6px 8px 6px 16px;display:flex;align-items:center;gap:16px;min-height:48px;box-shadow:0 3px 8px rgba(0,0,0,.3);z-index:50;max-width:560px}
.snackbar.nobar{bottom:32px}
.snackbar .btn{color:#9fb3ff;background:none;padding:0 8px}
.backdrop{position:fixed;inset:0;background:rgba(51,51,51,.5);display:flex;align-items:center;justify-content:center;z-index:60}
.modal{background:#fff;border-radius:4px;width:520px;padding:24px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.backdrop.enter{animation:fadeIn .3s ease-out}
.backdrop.enter .modal{animation:riseIn .35s cubic-bezier(.2,.8,.2,1)}
@keyframes fadeIn{from{opacity:0}}
@keyframes riseIn{from{opacity:0;transform:translateY(16px) scale(.98)}}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}

/* group sections */
table.sect{table-layout:fixed;margin-top:24px}
table.sect .cb{width:48px} table.sect .ed{width:56px}
tr.secthead td{border-bottom:0;padding:8px 12px 4px;vertical-align:middle}
tr.secthead .h4 .ann{font-weight:600}
td.emptyrow{padding:16px 12px;border-top:1px solid var(--fine)}
tr.colhead th{border-top:0}
tr.flash td{animation:flash 1.6s ease-out}
@keyframes flash{from{background:var(--blue100)}to{background:transparent}}
/* sticky selection bar on the grouping step */
.selbar.sticky{position:sticky;top:56px;z-index:15;transition:background .15s,box-shadow .15s}
.selbar.sticky.stuck{background:#fff;border-radius:0}
/* full-width white band behind the stuck bar; content stays aligned with the page */
.selbar.sticky.stuck::before{content:"";position:absolute;top:0;bottom:0;left:-100vw;right:-100vw;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15);z-index:-1}
html,body{overflow-x:clip}
/* groups table of contents */
.toc{position:fixed;top:120px;bottom:96px;left:calc(50% + 504px);width:200px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;z-index:5}
.toc a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;padding:6px 12px;border-left:2px solid var(--fine);color:var(--text);text-decoration:none;font-size:14px}
.toc a:hover{background:#0000000a}
.toc a.on{border-left-color:var(--primary);color:var(--primary);font-weight:600}
table.sect{scroll-margin-top:124px}
@media (max-width:1460px){ .content:has(.toc) .page.narrow{margin-left:max(32px,calc(50% - 600px));margin-right:auto;max-width:min(960px,calc(100% - 256px))} .toc{left:auto;right:24px} }
/* review cards */
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.gcard{border:1px solid var(--fine);border-radius:4px;padding:16px 20px}
.gcard ol{margin:12px 0 0;padding-left:22px;display:grid;gap:4px}
.gcard li{padding-left:2px}
.gcard li>div{display:flex;justify-content:space-between;gap:12px}
.gcard li::marker{color:var(--annotation)}
/* misc */
.empty{text-align:center;padding:64px 0;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .icon{width:48px;height:48px;color:var(--disabled)}
.card{border:1px solid var(--fine);border-radius:4px;padding:20px 24px;display:flex;align-items:center;gap:16px}
.pill{display:inline-block;background:var(--warnbg);border-radius:12px;padding:1px 10px;font-size:12px}
.link{color:var(--primary);background:none;border:0;font:inherit;cursor:pointer;padding:0;text-decoration:underline}
.loading{display:flex;align-items:center;gap:12px;padding:32px;justify-content:center}
.spinner{width:24px;height:24px;border:3px solid var(--fine);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.personrow{display:grid;grid-template-columns:1fr 1fr 1fr 40px;gap:12px 16px;align-items:start;padding:16px 0;border-top:1px solid var(--fine)}
.sectionhead+.personrow{border-top:0;padding-top:0}
.personrow .span2{grid-column:span 2}
.personrow .iconbtn{margin-top:10px}
.drafts{margin-top:16px;padding:16px;background:var(--blue50);border-radius:4px}
.drafts .personrow:first-child{border-top:0;padding-top:0}
.draftactions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px}
.sectionhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}

/* ================= admin UI ================= */
.appbar.admin{padding:0 24px 0 16px;gap:24px;justify-content:flex-start}
.appbar.admin .brand{display:flex;align-items:center;gap:12px;font-weight:600;font-size:16px;background:none;border:0;cursor:pointer;font-family:inherit;padding:0 8px 0 0}
.navtabs{display:flex;height:56px;align-self:stretch}
.navtab{display:flex;align-items:center;gap:6px;padding:0 16px;background:none;border:0;font:inherit;cursor:pointer;color:#000;border-bottom:3px solid transparent;border-top:3px solid transparent}
.navtab .icon{width:20px;height:20px}
.navtab:hover{background:#0000000d}
.navtab.on{border-bottom-color:#000;font-weight:600}
.appbar.admin .user{margin-left:auto;display:flex;align-items:center;gap:8px}
.acontent{padding:24px 32px 64px;max-width:1440px;margin:0 auto}
.apage{background:#fff;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.2);padding:28px 32px;max-width:1240px;margin:0 auto}
.apage+.apage{margin-top:16px}
.ahead{display:flex;align-items:flex-start;gap:12px}
.ahead h1{flex:1}
.subtabs{display:flex;gap:0;border-bottom:1px solid var(--fine);margin:16px -32px 24px;padding:0 20px}
.subtab{background:none;border:0;font:inherit;text-transform:uppercase;font-weight:600;color:var(--annotation);padding:12px 16px;cursor:pointer;border-bottom:2px solid transparent}
.subtab.on{color:var(--primary);border-bottom-color:var(--primary)}
.subtab:hover{background:#0000000a}
.toolbar{display:flex;gap:16px;align-items:center;margin-bottom:16px}
.toolbar .filter{flex:1}
.toolbar .field{width:180px;flex:none;min-height:46px;padding-top:18px;padding-bottom:3px}
.atable th{font-size:13px;font-weight:600;color:var(--annotation)}
.atable td{padding:12px}
.wk td{white-space:nowrap}
.tscroll{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.tscroll .atable td,.tscroll .atable th{white-space:nowrap}
.tscroll>table.atable.wk{min-width:1120px}
.tscroll>table:not(.atable){min-width:720px}
.atable th{white-space:nowrap}
.tscroll::-webkit-scrollbar{height:8px}.tscroll::-webkit-scrollbar-thumb{background:#ccc;border-radius:4px}
.amenu.floating{position:fixed;right:auto;bottom:auto}
.atable tr.day-last td{border-bottom:1px solid var(--fine)}
.atable tr.in-day td{border-bottom:0}
.atable tr.nothing td{background:#f5f5f5}
.atable tr:hover td.hov{background:#fafafa}
.trunc{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:12px;padding:2px 10px 2px 6px;font-size:13px;white-space:nowrap}
.chip .icon{width:16px;height:16px}
.chip.nolead{padding-left:10px}
.bot{display:inline-block;border:1px solid #bbb;border-radius:4px;font-size:10px;font-weight:600;letter-spacing:.04em;color:#666;padding:0 4px;margin-left:6px;vertical-align:1px;line-height:14px}
.morebtn{background:none;border:0;border-radius:50%;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.morebtn:hover{background:#0000000f}
.amenu{position:absolute;right:0;top:36px;background:#fff;border-radius:4px;box-shadow:0 4px 12px rgba(0,0,0,.25);min-width:220px;padding:6px 0;z-index:45;text-align:left}
.amenu.up{top:auto;bottom:36px}
.amenu button{display:block;width:100%;background:none;border:0;font:inherit;padding:9px 16px;cursor:pointer;text-align:left;white-space:nowrap}
.amenu button:hover:not([disabled]){background:var(--bg)}
.amenu button[disabled]{color:#aaa;cursor:not-allowed}
.amenu button.danger{color:var(--error)}
.amenu hr{border:0;border-top:1px solid var(--fine);margin:6px 0}
.amenu .opt-sel{background:var(--blue50);color:var(--primary)}
.gl{color:var(--primary);text-decoration:underline;background:none;border:0;font:inherit;cursor:pointer;padding:0;text-align:left}
.warnicon{color:#e6b800}
.stats{display:grid;grid-template-columns:repeat(3,1fr)}
.stats>div{padding:0 24px;border-left:1px solid var(--fine)}
.stats>div:first-child{padding-left:0;border-left:0}
.statv{font-size:22px;font-weight:600}
.facts{display:flex;gap:32px}
.weeknav{display:flex;align-items:center;gap:8px;margin-bottom:16px;position:relative}
.calpop{position:absolute;top:44px;left:120px;background:#fff;border-radius:4px;box-shadow:0 4px 16px rgba(0,0,0,.25);padding:12px;z-index:45;width:300px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;margin-top:8px}
.calgrid span{font-size:12px;color:var(--annotation);padding:4px 0}
.calgrid button{background:none;border:0;font:inherit;height:32px;border-radius:16px;cursor:pointer}
.calgrid button.out{color:#bbb}
.calgrid button.wk{background:var(--blue100);border-radius:0;font-weight:600}
.calgrid button:hover{outline:1px solid var(--primary)}
.backlink{display:inline-block;margin:0 0 12px calc(50% - 620px);color:var(--primary);background:none;border:0;font:inherit;cursor:pointer;text-decoration:underline}
@media (max-width:1300px){.backlink{margin-left:0}}
.convwrap{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start}
.sidepanel{background:#f7f7f7;border-radius:4px;padding:16px}
.sidepanel .stat+.stat{margin-top:16px}
.msg{display:flex;gap:12px;padding:8px 0}
.avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;flex:none;margin-top:2px}
.botmsg{background:var(--blue50);border:1px solid var(--blue100);border-radius:6px;padding:10px 12px;flex:1}
.daysep{display:flex;align-items:center;gap:12px;color:var(--annotation);font-size:12px;margin:12px 0}
.daysep::before,.daysep::after{content:"";flex:1;border-top:1px solid var(--fine)}
.trainercard{background:#f5f5f5;border-radius:4px;padding:12px 16px;display:flex;align-items:center;gap:16px;margin-bottom:16px}
.note{display:flex;gap:8px;align-items:flex-start;color:var(--annotation)}
.note .icon{width:20px;height:20px}
.preview{background:#f5f5f5;border-radius:4px;padding:16px}
.bubble{background:#fff;border-radius:6px;padding:12px 14px;box-shadow:0 1px 1px rgba(0,0,0,.08);white-space:pre-wrap}
.tokfield{background:var(--bg);border-bottom:1px solid var(--annotation);border-radius:4px 4px 0 0;padding:26px 12px 8px;min-height:50px;position:relative;line-height:2.1;cursor:text}
.tokfield:focus-within{border-bottom:2px solid var(--primary);padding-bottom:7px}
.tokfield>label{position:absolute;left:12px;top:4px;font-size:12px;color:var(--annotation)}
.tokfield:focus-within>label{color:var(--primary)}
.seg{outline:none;padding:2px 1px;min-width:4px;display:inline;white-space:pre-wrap}
.vchip{display:inline-flex;flex-direction:column;align-items:flex-start;vertical-align:middle;background:#fff;border:1px solid var(--blue100);border-radius:4px;padding:1px 22px 1px 6px;margin:0 3px;font:inherit;cursor:pointer;position:relative;line-height:1.25}
.vchip small{font-size:11px;color:var(--primary)}
.vchip b{font-weight:600;font-size:13px}
.vchip .icon{position:absolute;right:2px;bottom:2px;width:16px;height:16px;color:var(--annotation)}
.vmenu{position:absolute;background:#fff;border-radius:4px;box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:50;width:300px;padding:6px 0;line-height:1.45}
.vmenu .scroll{max-height:220px;overflow-y:auto}
.vmenu button{display:flex;justify-content:space-between;gap:12px;width:100%;background:none;border:0;font:inherit;padding:8px 14px;cursor:pointer;text-align:left}
.vmenu button:hover{background:var(--bg)}
.vmenu button.on{background:var(--blue50);color:var(--primary)}
.counter{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--annotation);margin:4px 0 0}
.mediabox{background:var(--bg);border-radius:4px;padding:12px 16px}
.pdf{width:32px;height:40px;border-radius:3px;background:#e53935;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.ftype{width:24px;height:30px;border-radius:3px;color:#fff;font-size:8px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.tplgrid{display:grid;grid-template-columns:1fr 340px;gap:32px;align-items:start}
.radios{display:flex;gap:24px;align-items:center}
.sel-bar{background:#eee;border-radius:4px;padding:6px 8px 6px 16px;display:flex;align-items:center;gap:12px;margin-bottom:16px;min-height:52px}
.uprow-fix td{background:#fff8e6}
.badtext{color:var(--error)}
.gopt{display:flex;align-items:center;gap:12px;padding:10px 8px;border-bottom:1px solid var(--fine);cursor:pointer}
.gopt.on{background:var(--blue50)}
.gopt.dis{color:#aaa;cursor:not-allowed}
.scrollist{max-height:300px;overflow-y:auto;margin-top:12px}
.tip{position:relative;display:inline-block}
.ahead .tip[data-tip]:hover::after{left:auto;right:0}

<body>
<div id="app"></div>
<script>
/* ---------- icons ---------- */
const P={

 err:'M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z',

 search:'M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z',
 people:'M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z'
};
const I=(n,cls='')=>`<svg class="icon ${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${P[n]}"/></svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- sample data ---------- */
const ROSTER_TRAINERS=[['Ruth Okot','+256 7XX XXX 201','Tororo'],['James Odongo','+256 7XX XXX 202','Tororo'],['Harriet Nabwire','+256 7XX XXX 203','Busia'],['Samuel Wandera','+256 7XX XXX 204','Butaleja'],['Lydia Namono','+256 7XX XXX 205','Mbale'],['Patrick Okiror','+256 7XX XXX 206','Pallisa']];
const ROSTER_TEACHERS=[
 ['Betty Akello','+256 7XX XXX 156','Busia'],['Charles Ochieng','+256 7XX XXX 166','Busia'],['Isaac Omoding','+256 7XX XXX 163','Busia'],
 ['Simon Oketcho','+256 7XX XXX 160','Busia'],['David Ssemanda','+256 7XX XXX 104','Busia'],['Brian Opio','+256 7XX XXX 124','Busia'],
 ['Mercy Atim','+256 7XX XXX 123','Busia'],['Rose Akurut','+256 7XX XXX 125','Busia'],
 ['Moses Okwi','+256 7XX XXX 135','Butaleja'],['Sylvia Auma','+256 7XX XXX 162','Butaleja'],['Ruth Amoit','+256 7XX XXX 165','Butaleja'],
 ['Ivan Ojok','+256 7XX XXX 151','Butaleja'],['Daniel Emojong','+256 7XX XXX 107','Butaleja'],['Peter Wanyama','+256 7XX XXX 136','Butaleja'],
 ['Grace Akello','+256 7XX XXX 101','Tororo'],['Florence Adongo','+256 7XX XXX 140','Tororo'],['Joan Akongo','+256 7XX XXX 121','Tororo'],
 ['John Ekwaru','+256 7XX XXX 161','Tororo'],['Grace Adeke','+256 7XX XXX 164','Tororo'],['Sarah Namukasa','+256 7XX XXX 102','Tororo'],
 ['Agnes Nabirye','+256 7XX XXX 103','Tororo'],['Robert Okello','+256 7XX XXX 105','Tororo'],['Esther Achieng','+256 7XX XXX 106','Tororo'],
 ['Paul Etyang','+256 7XX XXX 122','Tororo']
];
// Pad the sample roster to 112 teachers across five districts
(function(){
  const first=['Aisha','Alex','Annet','Benjamin','Brenda','Christine','Collins','Denis','Doreen','Edward','Eunice','Fred','Gloria','Hassan','Irene','Jacob','Janet','Joseph','Josephine','Juliet','Kenneth','Lilian','Martin','Mary','Michael','Monica','Nelson','Patience','Peace','Richard','Ronald','Ruth','Scovia','Stella','Steven','Teddy','Timothy','Vincent','Winnie','Yusuf'];
  const last=['Wafula','Nambozo','Barasa','Opolot','Kiiza','Mukasa','Auma','Oboth','Nangobi','Egesa','Okello','Namutebi','Ochola','Akol','Mugisha','Nakato','Ojambo','Akiror','Wasike','Atuhaire','Etyang','Namusoke','Odoi','Achom','Kato','Naigaga'];
  const used=new Set(ROSTER_TEACHERS.map(r=>r[0]));
  const plan=[['Busia',14],['Butaleja',18],['Tororo',22],['Mbale',20],['Pallisa',14]]; // +88
  let i=0,n=200;
  for(const [d,count] of plan) for(let c=0;c<count;c++){
    let name;do{name=first[(i*7)%first.length]+' '+last[(i*11+Math.floor(i/first.length))%last.length];i++}while(used.has(name));
    used.add(name);const num=String(300+(n++)).padStart(3,'0');
    ROSTER_TEACHERS.push([name,'+256 7XX XXX '+num.slice(-3),d]);
  }
  // Sample numbers are masked so no real phone number appears in the published prototype
  ROSTER_TEACHERS.forEach((r,k)=>{if(k>=24) r[1]='+256 7XX XXX '+String(300+k)});
})();
const SAMPLE_DOCS=['SESEMAT reflective practice framework.pdf','Gibbs reflective cycle summary.docx','Lesson study guide.pdf','Teacher learning circles handbook.docx'];
const MAX=7;
let uid=1; const nid=p=>p+(uid++);
const person=([name,phone,district,school='',subjects=''])=>({id:nid('p'),name,phone,district,school,subjects,group:null});
const SCHOOLS={Mbale:['Mbale Secondary School','Nkoma Secondary School'],Pallisa:['Pallisa Secondary School','Kamuge High School'],Busia:['Busia Secondary School','Mundika Secondary School'],Butaleja:['Butaleja Seed Secondary School','Busolwe Secondary School'],Tororo:['Tororo Girls School','Rock High School','Tororo College']};
const SUBJECTS=['Biology, Chemistry','Mathematics, Physics','Mathematics','Chemistry, Physics','Biology','Mathematics, Chemistry'];
const withMeta=(r,i)=>[...r,SCHOOLS[r[2]][i%SCHOOLS[r[2]].length],SUBJECTS[i%SUBJECTS.length]];

function fresh(){
  return {
    screen:'programs', draft:null,
    program:{name:'',partner:'',language:'English',docs:[]},
    method:'upload', uploadState:'empty', fileName:'',
    trainers:[], teachers:[], drafts:{trainers:[],teachers:[]},
    manual:{trainers:[person(['','',''])],teachers:[person(['','',''])]},
    groups:[], groupsBuiltFor:null,
    selected:new Set(), filter:'', sort:{key:'group',dir:1}, order:[], showNames:false,
    renaming:null, renameVal:'', renameErr:'', menuOpen:false,
    errors:{}, snackbar:null, modal:null, autoByDistrict:true, autoOnLoad:false, modalEnter:false
  };
}
let S=fresh();

/* ---------- helpers ---------- */
const STEP={w1:1,w2:2,w3:3,w4:4,w4c:4};
const gName=id=>S.groups.find(g=>g.id===id)?.name||'';
const members=gid=>S.teachers.filter(t=>t.group===gid);
const ungrouped=()=>S.teachers.filter(t=>!t.group);
const placesLeft=gid=>MAX-members(gid).length;
const list=a=>a.length<=1?a.join(''):a.slice(0,-1).join(', ')+' and '+a.at(-1);
const plural=(n,w,ws)=>`${n} ${n===1?w:(ws||w+'s')}`;
function snapshot(){return {groups:S.groups.map(g=>({...g})),map:Object.fromEntries(S.teachers.map(t=>[t.id,t.group]))}}
function restore(s){S.groups=s.groups;S.teachers.forEach(t=>t.group=s.map[t.id]??null)}
let snackTimer;
function snack(text,undo){S.snackbar={text,undo};clearTimeout(snackTimer);snackTimer=setTimeout(()=>{S.snackbar=null;render()},undo?8000:5000)}
function go(screen){S.screen=screen;S.errors={};S.menuOpen=false;if(S.snackbar?.undo)S.snackbar=null;window.scrollTo(0,0);render();
  if(screen==='w4'&&S.autoOnLoad){S.autoOnLoad=false;setTimeout(()=>{if(S.screen==='w4'&&!S.modal)openModal('auto')},600)}}
function openModal(m){S.modal=m;S.modalEnter=true;render();S.modalEnter=false}

function computeOrder(){
  const k=S.sort.key,d=S.sort.dir;
  const gi=t=>t.group?S.groups.findIndex(g=>g.id===t.group):-1;
  S.order=[...S.teachers].sort((a,b)=>{
    let r=0;
    if(k==='name') r=a.name.localeCompare(b.name);
    else if(k==='district') r=a.district.localeCompare(b.district)||a.name.localeCompare(b.name);
    else r=(gi(a)-gi(b))||a.name.localeCompare(b.name);
    return r*d;
  }).map(t=>t.id);
}
function issues(){
  const out=[];const u=ungrouped().length;
  if(u) out.push(`Put ${plural(u,'teacher')} in a group.`);
  const noTr=S.groups.filter(g=>members(g.id).length&&!g.trainer).map(g=>g.name);
  if(noTr.length) out.push(`Choose a trainer for ${list(noTr)}.`);
  const emp=S.groups.filter(g=>!members(g.id).length).map(g=>g.name);
  if(emp.length) out.push(`${list(emp)} ${emp.length>1?'have':'has'} no teachers. Add teachers or remove ${emp.length>1?'them':'it'}.`);
  return out;
}
function fillTrainers(){
  if(!S.trainers.length)return;
  // prefer a trainer from the group's district, then whoever has the fewest groups
  const load=t=>S.groups.filter(x=>x.trainer===t.id).length;
  S.groups.forEach(g=>{if(!g.trainer){const d=members(g.id)[0]?.district;
    g.trainer=[...S.trainers].sort((a,b)=>((a.district===d?0:1)-(b.district===d?0:1))*100+(load(a)-load(b)))[0].id;g.trainerAuto=true}});
}
function setupGroupsStep(){
  const key=S.teachers.map(t=>t.id).join();
  if(S.groupsBuiltFor!==key){
    const n=Math.max(1,Math.ceil(S.teachers.length/MAX));
    S.groups=Array.from({length:n},(_,i)=>({id:nid('g'),name:'Group '+(i+1),trainer:null}));
    S.teachers.forEach(t=>t.group=null);
    S.selected=new Set();S.groupsBuiltFor=key;S.sort={key:'name',dir:1};
    fillTrainers();
    S.autoByDistrict=true;S.showNames=false;S.autoOnLoad=true;
  }
  computeOrder();
}
// When regrouping, shuffle so a second run gives new combinations
let AUTO_SHUFFLE=false;
const shuffled=a=>{const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r};
const orderBy=(arr,cmp)=>AUTO_SHUFFLE?shuffled(arr).sort((a,b)=>cmp(a,b)):arr.sort((a,b)=>cmp(a,b)||a.name.localeCompare(b.name));
function autoGroup(byDistrict){
  const todo=orderBy(ungrouped(),(a,b)=>byDistrict?a.district.localeCompare(b.district):0);
  let free=S.groups.reduce((s,g)=>s+placesLeft(g.id),0);
  while(free<todo.length){const n=S.groups.length+1;S.groups.push({id:nid('g'),name:'Group '+n,trainer:null});free+=MAX}
  const target=Math.min(MAX,Math.ceil(S.teachers.length/S.groups.length));
  let i=0;
  for(const pass of [target,MAX]) for(const g of S.groups){
    let room=pass-members(g.id).length;
    while(room>0&&i<todo.length){todo[i++].group=g.id;room--}
  }
}

function autoGroupStrict(){
  const todo=ungrouped();const byD={};
  todo.forEach(t=>(byD[t.district||'—']=byD[t.district||'—']||[]).push(t));
  for(const d of Object.keys(byD).sort()){
    const ppl=orderBy(byD[d],()=>0);let i=0;
    // top up groups that already hold only this district
    for(const g of S.groups){const m=members(g.id);if(m.length&&m.every(t=>(t.district||'—')===d)){let room=MAX-m.length;while(room-->0&&i<ppl.length)ppl[i++].group=g.id}}
    const r=ppl.length-i;if(!r)continue;
    const k=Math.ceil(r/MAX),base=Math.floor(r/k),extra=r%k;
    for(let j=0;j<k;j++){
      let g=S.groups.find(x=>!members(x.id).length);
      if(!g){g={id:nid('g'),name:'',trainer:null};S.groups.push(g)}
      for(let c=0;c<base+(j<extra?1:0);c++)ppl[i++].group=g.id;
    }
  }
  // drop leftover empty groups nobody has set up, then number unnamed/default groups in order
  S.groups=S.groups.filter(g=>members(g.id).length||g.trainer||(g.name&&!/^Group \d+$/.test(g.name)));
  let n=1;S.groups.forEach(g=>{if(!g.name||/^Group \d+$/.test(g.name)){while(S.groups.some(x=>x!==g&&x.name==='Group '+n&&!/^Group \d+$/.test(x.name)))n++;g.name='Group '+(n++)}});
}
function autoPreview(){const snap=snapshot();const before=S.groups.length;if(!ungrouped().length)S.teachers.forEach(t=>t.group=null);S.autoByDistrict?autoGroupStrict():autoGroup(false);const n=S.groups.length;restore(snap);return {n,added:n-before}}

/* ---------- shells ---------- */
function wizard(inner,{cont='Continue',contAct='next',contDisabled=false,back=true,panel=''}={}){
  return `<div class="appbar black"><div class="title">Create a program</div>
    <button class="btn white" data-act="saveExit">SAVE AND EXIT</button></div>
  <div class="content ${panel?'withpanel':''}">${inner}</div>${panel}
  <div class="bottombar"><span class="ann">Step ${STEP[S.screen]} of 4</span><span class="spacer"></span>
    ${back?'<button class="btn secondary" data-act="back">BACK</button>':''}
    <button class="btn primary" data-act="${contAct}" ${contDisabled?'disabled':''}>${cont}</button></div>`;
}
const field=(id,label,val,{err,help,type='text',model}={})=>`<div><div class="field ${err?'error':''}">
  <input id="${id}" type="${type}" value="${esc(val)}" placeholder=" " data-model="${model||id}" autocomplete="off"><label for="${id}">${label}</label></div>
  ${err?`<div class="errtext">${err}</div>`:help?`<div class="help">${help}</div>`:''}</div>`;
function selectField(id,label,val,opts,{model,ph,compact=false,act}={}){
  const o=(ph?`<option value="">${ph}</option>`:'')+opts.map(x=>`<option value="${esc(x.v)}" ${x.v===val?'selected':''} ${x.dis?'disabled':''}>${esc(x.t)}</option>`).join('');
  return `<div class="field" style="${compact?'min-height:46px;padding-top:18px;padding-bottom:3px':''}"><label for="${id}">${label}</label>
    <select id="${id}" class="${val?'':'placeholder'}" ${model?`data-model="${model}"`:''} ${act?`data-change="${act}"`:''}>${o}</select>
    <span class="caret">${I('caret','sm')}</span></div>`;
}

/* ---------- screens ---------- */
function scrPrograms(){
  const d=S.draft;
  const body=S.ad?`<div class="card"><div style="flex:1"><div class="h5">${esc(progName())}</div>
      <div class="row" style="gap:8px;margin-top:4px"><span class="pill" style="background:${S.ad.launched?'#e3f5e8':'#eee'}">${S.ad.launched?'Active':'Not launched yet'}</span><span class="ann">${S.ad.groups.length} groups · ${S.ad.teachers.length} teachers</span></div></div>
      <button class="btn primary" data-act="openAdmin">OPEN</button></div>`
   :d?`<div class="card"><div style="flex:1"><div class="h5">${esc(S.program.name||'Untitled program')}</div>
      <div class="row" style="gap:8px;margin-top:4px"><span class="pill">Setup in progress</span><span class="ann">Step ${STEP[d.screen]} of 4</span></div></div>
      <button class="btn flat" data-act="askDelete">DELETE DRAFT</button><button class="btn primary" data-act="resume">Continue setup</button></div>`
   :`<div class="empty">${I('people')}<div class="h4">No programs yet</div><button class="btn primary" data-act="start">Create a program</button>
     <button class="link cap" data-act="demoAdmin">Prototype shortcut: open the admin UI with a running sample program</button></div>`;
  return `<div class="appbar yellow"><div class="title">${I('menu')}Nectar</div><span class="role">Admin</span></div>
   <div class="content"><div class="page stack"><div><h1 class="h3">Programs</h1><p class="ann">Each program holds its own people, groups, messages and library.</p></div>${body}</div></div>`;
}
function scrW1(){
  const p=S.program,e=S.errors;
  const docs=p.docs.map((d,i)=>`<div class="filechip">${I('doc')}<span style="flex:1">${esc(d)}</span><button class="iconbtn" title="Remove" data-act="rmDoc" data-i="${i}">${I('close','sm')}</button></div>`).join('');
  return wizard(`<div class="page narrow stack">
    <h1 class="h3">Program details</h1>
    ${field('f-name','Program name',p.name,{err:e.name,model:'program.name'})}
    ${field('f-partner','Organization name',p.partner,{model:'program.partner'})}
    <div>${selectField('f-lang','Language',p.language,['English','Luganda','Ateso','Swahili'].map(v=>({v,t:v})),{model:'program.language'})}<div class="help">Used for bot messages and templates</div></div>
    <div><h2 class="h5">Reference documents (optional)</h2><p class="ann" style="margin:4px 0 12px">Frameworks and principles the bot learns from, so it speaks to teachers in a familiar way. You can add more later in the Library.</p>
      <div class="drop"><div>Drag files here, or</div><button class="btn secondary" data-act="addDoc" ${p.docs.length>=SAMPLE_DOCS.length?'disabled':''}>CHOOSE FILES</button><div class="cap">${p.docs.length>=SAMPLE_DOCS.length?'No more sample files to add in this prototype':'PDF or Word documents'}</div></div>
      ${docs?`<div style="margin-top:12px">${docs}</div>`:''}</div>
  </div>`,{back:false});
}
function scrW2(){
  const card=(v,title,bul)=>`<label class="opt ${S.method===v?'on':''}"><input type="radio" name="method" value="${v}" ${S.method===v?'checked':''} data-change="method">
     <div><div class="h5">${title}</div><ul>${bul.map(b=>`<li>${b}</li>`).join('')}</ul></div></label>`;
  return wizard(`<div class="page narrow stack">
   <div><h1 class="h3">How would you like to add trainers and teachers?</h1><p class="ann">You can add more people later from the People tab, either way.</p></div>
   <div class="options" role="radiogroup">
    ${card('upload','Upload spreadsheet',['Best for a large program','Add all trainers and teachers in one file'])}
    ${card('manual','Enter manually',['Best for a small program','Type each trainer and teacher into a form','You’ll put teachers into groups in the next step'])}
   </div></div>`);
}
function scrW3Upload(){
  let inner;
  if(S.uploadState==='loading') inner=`<div class="loading"><div class="spinner"></div><span>Checking ${esc(S.fileName)}…</span></div>`;
  else if(S.uploadState==='done'){
    const dash=v=>v?esc(v):'<span class="ann">—</span>';
    const rows=arr=>arr.map(p=>`<tr><td><div>${esc(p.name)}</div><div class="cap">${esc(p.phone)}</div></td><td>${dash(p.district)}</td><td>${dash(p.school)}</td><td>${dash(p.subjects)}</td>
      <td style="width:48px"><button class="iconbtn" title="Edit ${esc(p.name)}" data-act="editPerson" data-id="${p.id}">${I('edit','sm')}</button></td></tr>`).join('');
    const head='<thead><tr><th>Name</th><th>District</th><th>School</th><th>Subjects</th><th></th></tr></thead>';
    inner=`<div class="filechip" style="border:1px solid var(--fine);border-radius:4px">${I('doc')}<div style="flex:1"><div>${esc(S.fileName)}</div><div class="cap">${plural(S.trainers.length,'trainer')} and ${plural(S.teachers.length,'teacher')} found</div></div><button class="btn flat" data-act="replaceFile">REPLACE FILE</button></div>
     <div class="alert success">${I('ok')}<div>File uploaded successfully.</div></div>
     ${S.errors.summary?`<div class="alert error">${I('err')}<div>${S.errors.summary}</div></div>`:''}
     <div><h2 class="h5" style="margin-bottom:8px">Trainers (${S.trainers.length})</h2><table>${head}<tbody>${rows(S.trainers)}</tbody></table>
       ${draftRows('trainers')}${S.drafts.trainers.length?'':`<button class="btn flat" style="margin-top:8px" data-act="addDraft" data-kind="trainers">${I('add','sm')}ADD TRAINER</button>`}</div>
     <div><h2 class="h5" style="margin-bottom:8px">Teachers (${S.teachers.length})</h2><table>${head}<tbody>${rows(S.teachers)}</tbody></table>
       ${draftRows('teachers')}${S.drafts.teachers.length?'':`<button class="btn flat" style="margin-top:8px" data-act="addDraft" data-kind="teachers">${I('add','sm')}ADD TEACHER</button>`}</div>`;
  } else {
    inner=`<div class="drop" style="padding:40px">${I('upload')}<button class="btn primary" data-act="upload">UPLOAD A FILE</button><div class="cap">Excel (.xlsx) or CSV</div></div>

// Let wide tables scroll sideways inside their card instead of spilling out.

function wrapTables(){
  document.querySelectorAll('.apage table, .page table:not(.sect)').forEach(t=>{
    if(t.parentElement.classList.contains('tscroll'))return;
    const w=document.createElement('div');w.className='tscroll';t.parentNode.insertBefore(w,t);w.appendChild(t)});
  document.querySelectorAll('.tscroll .amenu').forEach(m=>{const btn=m.parentElement.querySelector('.morebtn');if(!btn)return;
    const r=btn.getBoundingClientRect();m.classList.add('floating');const h=m.offsetHeight,wd=m.offsetWidth;
    const up=r.bottom+h+8>window.innerHeight&&r.top-h-4>0;
    m.style.top=(up?r.top-h-4:r.bottom+4)+'px';m.style.left=Math.max(8,Math.min(r.right-wd,window.innerWidth-wd-16))+'px'});
}

const PHONE=/^\+\d{1,3}[\s-]?[\dX][\dX\s-]{5,}$/i; // X allowed so masked sample numbers stay valid
function validateManual(){

  removePerson(){const d=S.edit;const isTr=d.orig==='trainer';const list=isTr?S.trainers:S.teachers;const idx=list.findIndex(x=>x.id===d.id);if(idx<0)return;
    const p=list[idx];const groupsWithTrainer=S.groups.filter(g=>g.trainer===p.id).map(g=>g.id);const wasSel=S.selected.has(p.id);
    const sync=()=>{if(S.screen==='w4'){S.groupsBuiltFor=S.teachers.map(t=>t.id).join();computeOrder()}};

function scrUsers(){

  const all=[...a.trainers,...a.teachers];
  let list=all.filter(p=>(!q||(p.name+' '+p.phone).toLowerCase().includes(q))&&(!fr||p.role===fr)&&(!fd||p.district===fd)&&(!fg||(fg==='none'?p.role==='teacher'&&!p.group:p.group===fg)));
  list=sortBy('u',list,{name:p=>p.name,role:p=>p.role,district:p=>p.district,group:p=>p.role==='trainer'?'':(grp(p.group)?.name||'~'),wa:p=>waOf(p),last:p=>lastOf(p)});
  if(!a.sort.u) list=[...list].sort((x,y)=>x.name.localeCompare(y.name));
  const PER=30;const key=[q,fr,fd,fg,JSON.stringify(a.sort.u||{})].join('|');if(a.uKey!==key){a.uKey=key;a.page=0}
  const pages=Math.max(1,Math.ceil(list.length/PER));a.page=Math.min(a.page||0,pages-1);
  const from=a.page*PER;const shown=list.slice(from,from+PER);
  const pager=`<div class="row" style="justify-content:flex-end;gap:8px;margin:4px 0 8px"><span>${list.length?`${from+1} - ${from+shown.length} of ${list.length.toLocaleString()}`:'0 of 0'}</span>

    <button class="iconbtn" data-act="uPage" data-d="1" aria-label="Next page" ${a.page<pages-1?'style="color:#000"':'disabled style="color:#000;opacity:.35;cursor:default;background:none"'}>${I('arrowR')}</button></div>`;const ung=a.teachers.filter(t=>!t.group).length;const sel=a.sel;

    return `<tr class="${sel.has(p.id)?'sel':''}"><td style="width:40px"><input type="checkbox" data-change="uSel" data-id="${p.id}" ${sel.has(p.id)?'checked':''} aria-label="Select ${esc(p.name)}"></td>
    <td><div style="font-weight:600">${esc(p.name)}</div><div class="cap">${esc(p.phone)}</div></td><td>${isT?'Trainer':'Teacher'}</td><td>${esc(p.district)}</td><td><span class="trunc" style="max-width:170px">${esc(p.school||'—')}</span></td><td><span class="trunc" style="max-width:120px">${esc(p.subjects||'—')}</span></td>
    <td>${isT?plural(ng,'group'):p.group?esc(grp(p.group).name):`<span class="row" style="gap:4px;font-size:12px;font-weight:600;color:#8a6100"><span class="warnicon">${I('warn','sm')}</span>Not in a group</span>`}</td>
    <td>${chip(isT?(L()?'joined':'notinv'):waOf(p))}</td><td>${isT?'<span class="ann">—</span>':lastOf(p)==null?`<span class="ann">${waOf(p)==='joined'?'No posts yet':'—'}</span>`:relCell(lastOf(p))}</td>
    <td style="text-align:right">${more('u-'+p.id,items,i>shown.length-4&&i>3)}</td></tr>`}).join('');
  const allVis=shown.length&&shown.every(p=>sel.has(p.id));

  return ashell('users',`<div class="apage" style="max-width:1300px"><div class="ahead"><h1 class="h3" style="font-size:24px">Users</h1><button class="btn secondary" data-act="startUpload">UPLOAD CSV</button><button class="btn primary" data-act="askUser">ADD USER</button></div>
    <div class="toolbar" style="margin-top:16px"><div class="filter">${I('search','sm')}<input id="q-u" placeholder="Search by name or phone" value="${esc(a.q.u||'')}" data-model="ad.q.u" data-live="1"></div>

    ${topBar}${pager}
    <table class="atable"><thead><tr><th><input type="checkbox" data-change="uSelAll" ${allVis?'checked':''} aria-label="Select all shown"></th><th>${sortH('u','name','Name')}</th><th>${sortH('u','role','Role')}</th><th>${sortH('u','district','District')}</th><th>School</th><th>Subjects</th><th>${sortH('u','group','Group')}</th><th>${sortH('u','wa','WhatsApp')}</th><th>${sortH('u','last','Last posted')}</th><th></th></tr></thead>
    <tbody>${rows||'<tr><td colspan="10" class="ann" style="text-align:center;padding:32px">No one matches</td></tr>'}</tbody></table>
    </div>`);
}

function enterEditGroups(newGroup){
  const a=AD();
  S.groups=a.groups.map(g=>({id:g.id,name:g.name,trainer:g.trainer}));
  S.trainers=a.trainers.map(t=>({...t}));S.teachers=a.teachers.map(t=>({...t}));
  S.egSnap={groups:S.groups.map(g=>({...g})),map:Object.fromEntries(S.teachers.map(t=>[t.id,t.group]))};
  S.egNewId=null;if(newGroup){const id=nid('g');S.egNewId=id;S.groups.push({id,name:newGroup.name,trainer:newGroup.tr||null,district:newGroup.district})}
  S.groups.sort((x,y)=>x.name.localeCompare(y.name,undefined,{numeric:true}));
  S.selected=new Set();S.filter='';S.sort={key:'group',dir:1};S.menuOpen=false;S.renaming=null;computeOrder();
  S.screen='editgroups';window.scrollTo(0,0);render();
}
function egChanges(){const s=S.egSnap;let n=0;const was=Object.fromEntries(s.groups.map(g=>[g.id,g]));
  S.teachers.forEach(t=>{if(s.map[t.id]!==t.group)n++});
  S.groups.forEach(g=>{const w=was[g.id];if(!w)n++;else{if(w.name!==g.name)n++;if(w.trainer!==g.trainer)n++}});
  n+=s.groups.filter(g=>!S.groups.some(x=>x.id===g.id)).length;return n}
function editShell(inner){const n=egChanges();const moved=S.teachers.filter(t=>S.egSnap.map[t.id]!==t.group).length;const newG=S.groups.filter(g=>!S.egSnap.groups.some(x=>x.id===g.id)).length;
  const parts=[];if(newG)parts.push(plural(newG,'new group'));if(moved)parts.push(plural(moved,'teacher')+' moved');const other=n-newG-moved;if(other>0)parts.push(plural(other,'other change'));
  return fullShell('Edit groups',inner,{left:parts.length?parts.join(' · '):'No unsaved changes',buttons:`<button class="btn primary" data-act="saveEditGroups" ${n?'':'disabled'}>SAVE CHANGES</button>`})}
function saveEditGroups(){const a=AD();const old=Object.fromEntries(a.groups.map(g=>[g.id,g]));
  a.groups=S.groups.map(g=>{const o=old[g.id];return o?{...o,name:g.name,trainer:g.trainer}:{id:g.id,name:g.name,trainer:g.trainer,district:g.district||g.name.split(' · ')[0],last:null}});
  let moved=0;S.teachers.forEach(t=>{const real=a.teachers.find(x=>x.id===t.id);if(!real)return;if(real.group!==t.group){moved++;real.group=t.group;real.wa=t.group?(L()?'invited':'notinv'):'notinv';real.last=null}
    Object.assign(real,{name:t.name,phone:t.phone,district:t.district,school:t.school,subjects:t.subjects})});
  a.teachers=a.teachers.filter(t=>S.teachers.some(x=>x.id===t.id));
  snack(moved&&L()?`Changes saved. ${plural(moved,'teacher')} will get their new group’s invite link.`:'Changes saved');aGo('groups');
}

function saveTpl(status){
  const e=S.ad.ed,a=AD();const err={};
  if(status==='pending'){
    if(!tokText(e.body).trim())err.body='Enter the message body';
    else if(typeof e.body.at(-1)==='string'&&!e.body.at(-1).trim()&&e.body.length>1)err.body='The body can’t end with a variable. Add some text after it.';
    if((e.isNew||e.kind==='Announcement')&&!e.name.trim())err.name='Enter a template name';
    if(e.kind!=='Automatic'&&e.recMode!=='fixed'&&recSummary(e).n===0)err.rec=e.recMode==='district'&&!e.recDistrict?'Choose a district':'Choose at least one recipient';
    if(tokText(e.body).length>1024)err.body='The body can be up to 1024 characters';
  }
  if(Object.keys(err).length){S.ad.edErr=err;render();document.querySelector('.errtext')?.scrollIntoView({block:'center'});return}
  const sched=e.kind==='Automatic'||e.trigger?null:`${e.date.replace(/ 2027$/,'')} · ${e.time} EAT`;
  if(e.isNew){a.templates.push({id:nid('tp'),name:e.name.trim()||'Untitled template',desc:tokText(e.body).slice(0,60),type:e.kind,author:'Kenneth Oroma',rec:toGroups(e)?'Groups':'Trainers',recMode:e.recMode,recDistrict:e.recDistrict,recGroups:e.recGroups,recTrainers:e.recTrainers,freq:e.kind==='Announcement'||e.repeat==='Does not repeat'?'Once':e.repeat==='Weekly'?'Every '+e.date.split(' ')[0].replace('Mon','Monday').replace('Fri','Friday'):e.repeat,sched,created:'21 Jan 2027',status,header:e.header,body:e.body,footer:e.footer,date:e.date,time:e.time,repeat:e.repeat})}
  else{const t=a.templates.find(x=>x.id===e.id);Object.assign(t,{status:t.status==='approved'&&status==='draft'?'approved':status,header:e.header,body:e.body,footer:e.footer,media:e.headerType==='media'?e.media:null});if(e.id==='review')S.ad.tplStatus={review:t.status};if(status==='pending'&&e.id==='checkin')S.ad.checkinStatus='pending'}
  snack(status==='pending'?'Submitted to Meta for review. This usually takes up to 24 hours.':'Draft saved');
  S.screen='admin';S.ad.tab='schedule';if(e.isNew)S.ad.stab='tpl';S.ad.ed=null;window.scrollTo(0,0);render();
}

document.addEventListener('click',e=>{if(!S.ad)return;

  if(S.ad.vm&&!inMenu){S.ad.vm=null;changed=true}

},true);
